services:
  db:
    image: postgres:16-alpine
    container_name: globalpool_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: globalpool
      POSTGRES_PASSWORD: globalpool
      POSTGRES_DB: globalpool
    ports:
      - "5433:5432"
    volumes:
      - globalpool_pg:/var/lib/postgresql/data

volumes:
  globalpool_pg:
